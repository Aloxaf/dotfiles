LANG=zh_CN.UTF-8
LC_ALL=zh_CN.UTF-8

XDG_CONFIG_HOME=$HOME/.config
XDG_CACHE_HOME=$HOME/.cache
XDG_DATA_HOME=$HOME/.local/share

WAKATIME_HOME=$XDG_CONFIG_HOME/wakatime
SQLITE_HISTORY=$XDG_DATA_HOME/sqlite_history
MPLAYER_HOME=$XDG_CONFIG_HOME/mplayer
TERMINFO=$XDG_DATA_HOME/terminfo
TERMINFO_DIRS=$XDG_DATA_HOME/terminfo:/usr/share/terminfo
ANDROID_SDK_HOME=$XDG_CONFIG_HOME/android
ANDROID_SDK_ROOT=$XDG_DATA_HOME/android
ANDROID_AVD_HOME=$XDG_DATA_HOME/android
ANDROID_EMULATOR_HOME=$XDG_DATA_HOME/android
ADB_VENDOR_KEY=$XDG_CONFIG_HOME/android
CARGO_HOME=$XDG_DATA_HOME/cargo
CCACHE_CONFIGPATH=$XDG_CONFIG_HOME/ccache.config
CCACHE_DIR=$XDG_CACHE_HOME/ccache
DOCKER_CONFIG=$XDG_CONFIG_HOME/docker

# xorg 输入法设置
#XIM=fcitx
#XIM_PROGRAM=fcitx
#GTK_IM_MODULE=fcitx
#QT_IM_MODULE=fcitx
#XMODIFIERS=@im=fcitx
# SDL 必须用 fcitx5，否则会套用对 fcitx4 的特殊处理导致 fcitx5 启动失败
#SDL_IM_MODULE=fcitx5

# wayland 输入法设置
QT_IM_MODULES=wayland;fcitx
QT_IM_MODULE=fcitx
XMODIFIERS=@im=fcitx

PATH=$HOME/.local/bin:$CARGO_HOME/bin:$HOME/.gem/ruby/3.0.0/bin:$HOME/go/bin:$PATH

_JAVA_OPTIONS='-Dawt.useSystemAAFontSettings=on'

# for cuda-tools
# 会导致 sqlite3 定位到 /opt/cuda/nsight_systems/target-linux-x64/libsqlite3.so.0
# 然后 kactivitymanagerd 崩溃
#LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/opt/cuda/nsight_systems/target-linux-x64/ 

# https://goproxy.io/zh/
GOPROXY=https://goproxy.cn
# 不走 proxy 的私有仓库或组，多个用逗号相隔
# GOPRIVATE=git.mycompany.com,github.com/my/private
